name: Tests

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      # Headless Qt + WebEngine (Chromium) so the rendered-diagram tests can run.
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --in-process-gpu"
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt / WebEngine system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libnss3 libnspr4 \
            libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxi6 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-xfixes0 fonts-dejavu-core fontconfig

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (incl. dev / pytest)
        run: uv sync

      - name: Run tests
        run: uv run pytest -q
