[project]
name = "xsltomermaid"
version = "0.7.0"
description = "Qt app that turns a database-schema Excel file into a Mermaid ER diagram"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
]

[project.scripts]
xsltomermaid = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
