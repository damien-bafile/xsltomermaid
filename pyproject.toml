[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xsltomermaid"
version = "0.11.1"
description = "Qt app that turns a database-schema Excel file into a Mermaid ER diagram"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
]

[project.scripts]
xsltomermaid = "xsltomermaid.main:main"
xsltomermaid-sample = "xsltomermaid.make_sample:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.6",
]

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xsltomermaid = ["assets/*", "vendor/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src"]
